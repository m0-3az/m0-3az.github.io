<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#070512">
<title>Moaaz Essam</title>
<meta name="description" content="Moaaz Essam — Cybersecurity student & Linux system administrator.">
<meta property="og:title" content="Moaaz Essam">
<meta property="og:description" content="Cybersecurity student & Linux system administrator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070512;
    --bg-raised:rgba(168,110,255,.10);
    --bg-inset:rgba(168,110,255,.06);
    --border:rgba(196,150,255,.22);
    --border-hi:rgba(216,180,255,.45);
    --glass-hi:rgba(255,255,255,.14);
    --text:#ece6fb;
    --text-dim:#a99fc9;
    --text-faint:#6b5f8c;
    --amber:#d0a2ff;
    --cyan:#c084fc;
    --accent:#a855f7;
    --success:#22c55e;
    --mono-display:'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
    --mono-body:'JetBrains Mono', 'Fira Code', ui-monospace, 'SF Mono', 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 700px 500px at 15% -10%, rgba(168,85,247,.45), transparent 60%),
      radial-gradient(ellipse 600px 550px at 100% 20%, rgba(124,58,237,.35), transparent 55%),
      radial-gradient(ellipse 550px 500px at 10% 100%, rgba(216,180,254,.22), transparent 55%),
      radial-gradient(ellipse 500px 450px at 90% 95%, rgba(139,92,246,.3), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--mono-body);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 18px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--bg-raised);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    padding:28px 26px 24px;
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    box-shadow:
      inset 0 1px 0 var(--glass-hi),
      inset 0 0 0 1px rgba(255,255,255,.03),
      0 20px 50px -12px rgba(88,28,135,.55);
  }
  .card::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  }
  .card::after{
    content:"";
    position:absolute;inset:0;
    border-radius:inherit;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,.1) 0%, transparent 35%);
  }

  /* identity block */
  .identity{
    display:flex;
    gap:16px;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .photo-wrap{
    flex:0 0 auto;
  }
  .photo-frame{
    width:76px;
    height:76px;
    border-radius:12px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.15);
    background:var(--bg-inset);
    box-shadow:0 0 0 1px rgba(168,85,247,.15), 0 8px 20px -6px rgba(124,58,237,.55);
  }
  .photo-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    filter:grayscale(12%) contrast(1.04);
  }
  .who{
    padding-top:2px;
    min-width:0;
  }
  .who h1{
    font-family:var(--mono-display);
    font-size:20px;
    font-weight:700;
    margin:0 0 4px;
    color:var(--text);
    letter-spacing:-0.2px;
  }
  .who .role{
    font-size:12.5px;
    color:var(--text-dim);
    margin:0;
  }

  /* neofetch-style stats */
  .stats{
    margin-bottom:20px;
  }
  .stat{
    display:flex;
    font-size:12.5px;
    padding:3px 0;
    gap:10px;
  }
  .stat .key{
    flex:0 0 62px;
    color:var(--text-faint);
  }
  .stat .val{
    color:var(--text);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--success);
    box-shadow:0 0 0 3px rgba(34,197,94,0.2), 0 0 8px rgba(34,197,94,0.7);
    flex:0 0 auto;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.45; }
  }

  /* links */
  .links{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:20px;
  }
  .link-btn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    background:var(--bg-inset);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text);
    text-decoration:none;
    font-size:13.5px;
    font-weight:500;
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
    transition:border-color 0.15s ease, transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .link-btn:hover, .link-btn:focus-visible{
    border-color:var(--accent);
    background:rgba(255,255,255,.08);
    transform:translateY(-1px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 20px -8px rgba(168,85,247,.5);
    outline:none;
  }
  .link-btn .tag{
    flex:0 0 auto;
    width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
    background:rgba(0,0,0,.25);
    border:1px solid var(--border);
    border-radius:7px;
  }
  .link-btn .tag svg{
    width:15px;height:15px;
    opacity:.85;
    transition:opacity .15s ease;
  }
  .link-btn:hover .tag svg{opacity:1;}
  .link-btn .label{
    flex:1 1 auto;
  }
  .link-btn .arrow{
    flex:0 0 auto;
    color:var(--accent);
    opacity:0.9;
    display:flex;align-items:center;
  }
  .link-btn .arrow svg{
    width:15px;height:15px;
    display:block;
    transition:transform .15s ease;
  }
  .link-btn:hover .arrow svg{
    transform:translateX(4px);
  }

  .link-label{
    font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    color:var(--text-faint);
    margin:2px 2px 0;
  }

  footer{
    text-align:center;
  }
  footer .comment{
    font-size:11px;
    color:var(--text-faint);
    margin:0;
  }

  /* progressive enhancement: only hide/animate when JS says so */
  .js .profile{
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.5s ease, transform 0.5s ease;
  }
  .js .profile.revealed{
    opacity:1;
    transform:translateY(0);
  }
  .js .cmd{ }

  @media (prefers-reduced-motion: reduce){
    .js .profile{ transition:none; opacity:1; transform:none; }
    .cursor{ animation:none; }
    .dot{ animation:none; }
  }

  @media (max-width:360px){
    .card{ padding:22px 18px 20px; }
    .who h1{ font-size:18px; }
  }
</style>
</head>
